<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurodivergence Screening</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f1923; --surface:#1a2735; --surface2:#212f3d; --border:#2e3f52;
    --teal:#5ba8c4; --teal-light:#8fc5d8; --amber:#c48040; --lavender:#b07a9e;
    --rose:#c47a7a; --rose-light:#daa0a0; --muted:#7a91a4; --text:#d8e4ec;
    --text-dim:#8fa5b8; --radius:14px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

  .lang-toggle {
    position:fixed; top:16px; right:16px; z-index:100;
    display:flex; background:var(--surface2); border:1.5px solid var(--border);
    border-radius:20px; overflow:hidden; font-size:12px; font-weight:500;
  }
  .lang-toggle button {
    background:none; border:none; color:var(--text-dim); padding:6px 14px;
    cursor:pointer; font-family:'DM Sans',sans-serif; font-size:12px; transition:all 0.15s;
  }
  .lang-toggle button.active { background:var(--teal); color:#fff; }

  .header { background:linear-gradient(160deg,#0f1923 0%,#162231 100%); padding:52px 32px 44px; text-align:center; position:relative; overflow:hidden; border-bottom:1px solid var(--border); }
  .header::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 15% 0%,rgba(91,168,196,0.12) 0%,transparent 55%),radial-gradient(ellipse at 88% 100%,rgba(176,122,158,0.1) 0%,transparent 50%); }
  .header-inner { position:relative; z-index:1; max-width:720px; margin:0 auto; }
  .eyebrow { font-size:10px; letter-spacing:3.5px; text-transform:uppercase; color:var(--teal-light); margin-bottom:16px; font-weight:500; }
  .header h1 { font-family:'Playfair Display',serif; font-size:clamp(22px,4.5vw,34px); font-weight:400; line-height:1.28; color:#edf3f7; margin-bottom:16px; }
  .header h1 em { font-style:italic; color:var(--teal-light); }
  .header-note { font-size:13.5px; color:var(--text-dim); line-height:1.6; max-width:540px; margin:0 auto; }

  .response-key { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; padding:16px 24px; background:var(--surface); border-bottom:1px solid var(--border); }
  .key-chip { padding:4px 12px; border-radius:20px; border:1.5px solid var(--border); background:var(--surface2); font-size:11.5px; color:var(--text-dim); font-weight:500; }
  .key-sep { color:var(--border); display:flex; align-items:center; }

  .progress-bar-wrap { background:var(--surface); padding:14px 24px; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
  .progress-meta { display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); max-width:720px; margin:0 auto 8px; }
  .progress-track { height:3px; background:var(--border); border-radius:2px; overflow:hidden; max-width:720px; margin:0 auto; }
  .progress-fill { height:100%; background:linear-gradient(90deg,var(--teal),var(--teal-light)); border-radius:2px; transition:width 0.4s ease; width:0%; }

  #form-screen { max-width:720px; margin:0 auto; padding:0 20px 60px; }
  .section-header { margin:44px 0 6px; display:flex; align-items:flex-start; gap:14px; }
  .section-dot { width:10px; height:10px; border-radius:50%; margin-top:6px; flex-shrink:0; }
  .section-title { font-family:'Playfair Display',serif; font-size:18px; font-weight:400; line-height:1.2; margin-bottom:4px; }
  .section-title em { font-style:italic; }
  .section-sub { font-size:12px; color:var(--text-dim); line-height:1.5; }
  .section-note { font-size:12.5px; color:var(--text-dim); line-height:1.6; background:var(--surface); border-left:3px solid var(--border); border-radius:0 8px 8px 0; padding:12px 16px; margin-bottom:18px; font-style:italic; }

  .q-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px 24px 18px; margin-bottom:10px; transition:border-color 0.2s; }
  .q-card.answered { border-color:rgba(91,168,196,0.3); }
  .q-text { font-size:14.5px; line-height:1.65; color:var(--text); margin-bottom:16px; }

  .response-options { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  @media (max-width:480px){ .response-options{ grid-template-columns:1fr; gap:6px; } }
  .response-btn { padding:11px 8px; border-radius:9px; border:1.5px solid var(--border); background:var(--surface2); color:var(--text-dim); font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; transition:all 0.15s; text-align:center; line-height:1.3; }
  .response-btn:hover { border-color:var(--teal); color:var(--teal-light); }
  .response-btn.sel-2 { background:rgba(91,168,196,0.18); border-color:var(--teal); color:var(--teal-light); }
  .response-btn.sel-1 { background:rgba(196,128,64,0.15); border-color:var(--amber); color:#d9a06a; }
  .response-btn.sel-0 { background:rgba(46,63,82,0.6); border-color:#3d5268; color:var(--muted); }

  .submit-wrap { margin-top:40px; text-align:center; }
  .btn-submit { display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,var(--teal) 0%,#4a9ab8 100%); color:#fff; border:none; border-radius:10px; padding:15px 36px; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:500; cursor:pointer; transition:opacity 0.2s,transform 0.15s; }
  .btn-submit:hover { opacity:0.9; transform:translateY(-1px); }
  .btn-submit svg { width:18px; height:18px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; }
  .error-msg { display:none; color:#e07a6a; font-size:13px; margin-top:12px; }

  #intake-screen { display:none; max-width:520px; margin:0 auto; padding:60px 24px; }
  .intake-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:36px 32px; text-align:center; }
  .intake-card h2 { font-family:'Playfair Display',serif; font-size:22px; font-weight:400; color:#edf3f7; margin-bottom:10px; }
  .intake-card h2 em { font-style:italic; color:var(--teal-light); }
  .intake-sub { font-size:13.5px; color:var(--text-dim); margin-bottom:28px; line-height:1.6; }
  .field-group { margin-bottom:14px; text-align:left; }
  .field-label { font-size:11px; color:var(--text-dim); margin-bottom:6px; display:block; letter-spacing:0.8px; text-transform:uppercase; }
  .field-input { width:100%; background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; padding:11px 14px; font-family:'DM Sans',sans-serif; font-size:14px; color:var(--text); outline:none; transition:border-color 0.15s; }
  .field-input:focus { border-color:var(--teal); }
  .field-input::placeholder { color:var(--muted); }
  .btn-intake { width:100%; margin-top:20px; background:linear-gradient(135deg,var(--teal) 0%,#4a9ab8 100%); color:#fff; border:none; border-radius:10px; padding:14px; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:500; cursor:pointer; transition:opacity 0.2s; }
  .btn-intake:hover { opacity:0.9; }
  .btn-intake:disabled { opacity:0.5; cursor:not-allowed; }
  #intake-error { display:none; color:#e07a6a; font-size:12.5px; margin-top:10px; }
  #sending-msg { display:none; color:var(--teal-light); font-size:12.5px; margin-top:10px; }
  .privacy-note { font-size:11.5px; color:var(--text-dim); margin-top:16px; line-height:1.5; }

  #confirm-screen { display:none; max-width:520px; margin:0 auto; padding:60px 24px; text-align:center; }
  .confirm-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:48px 32px; }
  .confirm-icon { width:56px; height:56px; border-radius:50%; background:rgba(91,168,196,0.12); border:1.5px solid rgba(91,168,196,0.3); display:flex; align-items:center; justify-content:center; margin:0 auto 24px; }
  .confirm-icon svg { width:26px; height:26px; stroke:var(--teal-light); fill:none; stroke-width:2; stroke-linecap:round; }
  .confirm-card h2 { font-family:'Playfair Display',serif; font-size:24px; font-weight:400; color:#edf3f7; margin-bottom:12px; }
  .confirm-card h2 em { font-style:italic; color:var(--teal-light); }
  .confirm-card p { font-size:14px; color:var(--text-dim); line-height:1.7; margin-bottom:10px; }
  .btn-book { display:inline-flex; align-items:center; gap:8px; margin-top:28px; background:var(--surface2); color:var(--teal-light); border:1.5px solid rgba(91,168,196,0.3); border-radius:10px; padding:13px 28px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; text-decoration:none; transition:all 0.2s; }
  .btn-book:hover { background:rgba(91,168,196,0.1); border-color:var(--teal); color:#fff; }
  .btn-book svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; }
</style>
</head>
<body>

<div class="lang-toggle">
  <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
  <button id="btn-tl" onclick="setLang('tl')">TL</button>
</div>

<div class="header">
  <div class="header-inner">
    <div class="eyebrow" id="eyebrow">Sycip Integrative Practice</div>
    <h1 id="title"></h1>
    <p class="header-note" id="header-note"></p>
  </div>
</div>

<div class="response-key" id="response-key"></div>

<div class="progress-bar-wrap">
  <div class="progress-meta">
    <span id="progress-text"></span>
    <span id="progress-pct">0%</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
</div>

<div id="form-screen">
  <!-- SECTION A: MASKED -->
  <div class="section-header">
    <div class="section-dot" style="background:var(--teal);"></div>
    <div class="section-info">
      <div class="section-title" style="color:var(--teal-light);" id="sA-title"></div>
      <div class="section-sub" id="sA-sub"></div>
    </div>
  </div>
  <div class="section-note" id="sA-note"></div>
  <div class="q-card" data-q="1"><div class="q-text" id="q1t"></div><div class="response-options" id="q1"></div></div>
  <div class="q-card" data-q="2"><div class="q-text" id="q2t"></div><div class="response-options" id="q2"></div></div>
  <div class="q-card" data-q="3"><div class="q-text" id="q3t"></div><div class="response-options" id="q3"></div></div>
  <div class="q-card" data-q="4"><div class="q-text" id="q4t"></div><div class="response-options" id="q4"></div></div>
  <div class="q-card" data-q="5"><div class="q-text" id="q5t"></div><div class="response-options" id="q5"></div></div>
  <div class="q-card" data-q="6"><div class="q-text" id="q6t"></div><div class="response-options" id="q6"></div></div>
  <div class="q-card" data-q="26"><div class="q-text" id="q26t"></div><div class="response-options" id="q26"></div></div>

  <!-- SECTION B: UNMASKED -->
  <div class="section-header">
    <div class="section-dot" style="background:var(--rose);"></div>
    <div class="section-info">
      <div class="section-title" style="color:var(--rose-light);" id="sB-title"></div>
      <div class="section-sub" id="sB-sub"></div>
    </div>
  </div>
  <div class="section-note" id="sB-note"></div>
  <div class="q-card" data-q="28"><div class="q-text" id="q28t"></div><div class="response-options" id="q28"></div></div>
  <div class="q-card" data-q="29"><div class="q-text" id="q29t"></div><div class="response-options" id="q29"></div></div>
  <div class="q-card" data-q="30"><div class="q-text" id="q30t"></div><div class="response-options" id="q30"></div></div>
  <div class="q-card" data-q="31"><div class="q-text" id="q31t"></div><div class="response-options" id="q31"></div></div>
  <div class="q-card" data-q="32"><div class="q-text" id="q32t"></div><div class="response-options" id="q32"></div></div>

  <!-- SECTION C: ADHD -->
  <div class="section-header">
    <div class="section-dot" style="background:var(--amber);"></div>
    <div class="section-info">
      <div class="section-title" style="color:#d9a06a;" id="sC-title"></div>
      <div class="section-sub" id="sC-sub"></div>
    </div>
  </div>
  <div class="q-card" data-q="8"><div class="q-text" id="q8t"></div><div class="response-options" id="q8"></div></div>
  <div class="q-card" data-q="9"><div class="q-text" id="q9t"></div><div class="response-options" id="q9"></div></div>
  <div class="q-card" data-q="10"><div class="q-text" id="q10t"></div><div class="response-options" id="q10"></div></div>
  <div class="q-card" data-q="11"><div class="q-text" id="q11t"></div><div class="response-options" id="q11"></div></div>
  <div class="q-card" data-q="12"><div class="q-text" id="q12t"></div><div class="response-options" id="q12"></div></div>
  <div class="q-card" data-q="13"><div class="q-text" id="q13t"></div><div class="response-options" id="q13"></div></div>
  <div class="q-card" data-q="14"><div class="q-text" id="q14t"></div><div class="response-options" id="q14"></div></div>
  <div class="q-card" data-q="15"><div class="q-text" id="q15t"></div><div class="response-options" id="q15"></div></div>
  <div class="q-card" data-q="27"><div class="q-text" id="q27t"></div><div class="response-options" id="q27"></div></div>

  <!-- SECTION D: AuDHD -->
  <div class="section-header">
    <div class="section-dot" style="background:var(--lavender);"></div>
    <div class="section-info">
      <div class="section-title" style="color:#c99abd;" id="sD-title"></div>
      <div class="section-sub" id="sD-sub"></div>
    </div>
  </div>
  <div class="q-card" data-q="17"><div class="q-text" id="q17t"></div><div class="response-options" id="q17"></div></div>
  <div class="q-card" data-q="18"><div class="q-text" id="q18t"></div><div class="response-options" id="q18"></div></div>
  <div class="q-card" data-q="19"><div class="q-text" id="q19t"></div><div class="response-options" id="q19"></div></div>
  <div class="q-card" data-q="20"><div class="q-text" id="q20t"></div><div class="response-options" id="q20"></div></div>
  <div class="q-card" data-q="21"><div class="q-text" id="q21t"></div><div class="response-options" id="q21"></div></div>
  <div class="q-card" data-q="22"><div class="q-text" id="q22t"></div><div class="response-options" id="q22"></div></div>
  <div class="q-card" data-q="23"><div class="q-text" id="q23t"></div><div class="response-options" id="q23"></div></div>
  <div class="q-card" data-q="24"><div class="q-text" id="q24t"></div><div class="response-options" id="q24"></div></div>

  <div class="submit-wrap">
    <button class="btn-submit" id="btn-continue" onclick="goToIntake()">
      <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      <span id="btn-continue-text"></span>
    </button>
    <div class="error-msg" id="error-msg"></div>
  </div>
</div>

<div id="intake-screen">
  <div class="intake-card">
    <h2 id="intake-title"></h2>
    <p class="intake-sub" id="intake-sub"></p>
    <div class="field-group">
      <label class="field-label" id="label-name"></label>
      <input class="field-input" type="text" id="intake-name">
    </div>
    <div class="field-group">
      <label class="field-label" id="label-email"></label>
      <input class="field-input" type="email" id="intake-email">
    </div>
    <button class="btn-intake" id="intake-btn" onclick="handleSubmit()"></button>
    <div id="intake-error"></div>
    <div id="sending-msg"></div>
    <p class="privacy-note" id="privacy-note"></p>
  </div>
</div>

<div id="confirm-screen">
  <div class="confirm-card">
    <div class="confirm-icon"><svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
    <h2 id="confirm-title"></h2>
    <p id="confirm-p1"></p>
    <p id="confirm-p2"></p>
    <a class="btn-book" href="https://tidycal.com/rinkasycip" target="_blank">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span id="btn-book-text"></span>
    </a>
  </div>
</div>

<script>
  const FORMSPREE_URL = 'https://formspree.io/f/xwvwoell';
  const MASKED_QS=[1,2,3,4,5,6,26], UNMASKED_QS=[28,29,30,31,32], ADHD_QS=[8,9,10,11,12,13,14,15,27], AUDHD_QS=[17,18,19,20,21,22,23,24];
  const ALL_QS=[...MASKED_QS,...UNMASKED_QS,...ADHD_QS,...AUDHD_QS];
  const TOTAL=ALL_QS.length;
  const answers={};
  let lang='en';

  const T = {
    en: {
      title:'Neurodivergence<br><em>Screening</em>',
      headerNote:"This is not a diagnosis. It's a way of noticing patterns that may have shaped how you move through the world. Your responses are shared only with the practitioner.",
      keys:['I can relate to this','I relate to this somewhat','I have never experienced this'],
      progress:(d)=>`${d} of ${TOTAL} answered`,
      sA:{t:'Masked <em>Autism</em>',s:'What you consciously do to navigate social life',n:"These patterns reflect learned strategies — ways of adapting to social environments that weren't designed with you in mind. They often develop quietly over many years."},
      sB:{t:'Unmasked <em>Autism</em>',s:"Underlying traits that exist beneath the surface — often regardless of how well you've learned to adapt",n:"These are traits that don't go away with practice or effort. They reflect how your nervous system and perception are wired — not how you've chosen to present yourself."},
      sC:{t:'Attention <em>& Executive Function</em>',s:'How your mind manages focus, time, and tasks'},
      sD:{t:'Paradoxical <em>Internal Experiences</em>',s:'Patterns that feel contradictory — both things are true at the same time'},
      q:{
        1:"Before conversations or social situations, I mentally rehearse what I'll say — running through scenarios, responses, or potential outcomes in advance.",
        2:"After social interactions, I feel mentally or emotionally drained — even when things went well.",
        3:"Sometimes, I realize I've taken on the tone, gestures, or expressions of others during conversations and interactions.",
        4:"Changes to plans, routines, or environments cause me significant internal stress — even when I appear calm on the outside.",
        5:"I find myself overanalyzing social interactions afterward — replaying what was said, what it meant, whether I responded correctly.",
        6:"In social settings, I sometimes feel like I'm performing a role rather than simply being myself.",
        26:"There are specific topics or areas I return to with deep, sustained interest — I accumulate knowledge about them and they feel like a significant part of who I am.",
        28:"I tend to notice small sounds, textures, smells, or light that others around me seem to not register at all.",
        29:"When someone says one thing but seems to mean another, I have to consciously work out what they actually mean — it doesn't come automatically.",
        30:"Working out what someone is feeling just by looking at their face doesn't come naturally to me — I often have to guess or ask.",
        31:"I find it difficult to figure out what people want from an interaction unless they say it directly.",
        32:"I'm drawn to collecting or organizing detailed information about specific topics or categories — I find it deeply satisfying in a way that others don't always understand.",
        8:"My mind wanders frequently — during conversations, tasks, or quiet moments — even when I'm trying to stay present.",
        9:"Starting tasks feels overwhelming. Even when I know what needs to be done, the gap between intention and action is wide.",
        10:"My thoughts move quickly or feel restless — even when I'm tired or trying to rest, my mind keeps running.",
        11:"I forget details, appointments, or things I've been told — not because I don't care, but because the information doesn't seem to stick.",
        12:"My thoughts often feel scattered or difficult to sequence — planning and organizing steps feels harder than it seems like it should be.",
        13:"Emotional ups and downs happen quickly inside me, but I don't always express them outwardly.",
        14:"I zone out during conversations or meetings, missing key information despite trying to pay attention.",
        15:"I start tasks with good intentions but often find myself drifting to something else before finishing.",
        27:"I get intensely excited about new hobbies or interests, dive in fully — then find myself moving on before long, with only one or two things ever sticking.",
        17:"I crave novelty and excitement — like starting new projects impulsively — but I also feel deeply unsettled by changes to my routines or plans.",
        18:"I can hyperfocus intensely on topics that interest me for hours, yet struggle to maintain attention on everyday tasks — leading to cycles of productivity highs and crashes.",
        19:"I experience both sensory shutdown (feeling overwhelmed and needing to withdraw) and sensory seeking (craving stimulation, movement, or noise) — sometimes in the same day.",
        20:"I act impulsively in the moment, then spend significant time afterward overanalyzing what I said or did.",
        21:"I need external structure to function, but my mind resists or races against the very routines I try to set up for myself.",
        22:"I feel emotions intensely and deeply, but I've developed ways to mask or contain them — so others often don't realize the full weight of what I'm carrying.",
        23:"I want connection and belonging, but I often find myself misreading social cues or feeling out of step in group dynamics — even in familiar settings.",
        24:"I rely on rigid personal rituals or routines to feel safe, but I also struggle to follow through on structured tasks or sequences when they're set by others."
      },
      btnContinue:'Continue to submit',
      errorMsg:'Please respond to all questions before continuing.',
      intakeTitle:'Almost there — <em>one last step</em>',
      intakeSub:'Your responses are ready to send. Enter your name and email so the practitioner can follow up with you personally.',
      labelName:'Your name', labelEmail:'Email address',
      namePh:'First and last name', emailPh:'you@example.com',
      intakeBtn:'Send my responses',
      intakeError:'Please enter a valid name and email address.',
      sending:'Sending your responses…',
      privacy:"Your scores are sent directly to the practitioner — you won't see them here. Rinka will review and follow up with you personally.",
      confirmTitle:'Your screening is<br><em>complete</em>',
      confirmP1:"Thank you for taking the time to reflect and respond. What you've shared gives Rinka a clearer picture of how you experience the world — and how to best support you.",
      confirmP2:"She'll review your responses before your session. You don't need to do anything else to prepare.",
      btnBook:'Book a Scoping Session'
    },
    tl: {
      title:'Neurodivergence<br><em>Screening</em>',
      headerNote:"Hindi po ito isang diagnosis. Isa po itong paraan para mapansin ang mga pattern na maaaring humubog sa paraan ng inyong pamumuhay. Ang inyong mga sagot ay ibabahagi lamang sa practitioner.",
      keys:['Nararanasan ko ito','Minsan ko itong nararanasan','Hindi ko pa ito naranasan'],
      progress:(d)=>`${d} sa ${TOTAL} ang nasagutan`,
      sA:{t:'Masked <em>Autism</em>',s:'Mga bagay na sadyang ginagawa ninyo para makibagay sa lipunan',n:"Ang mga pattern na ito ay mga natutunang estratehiya — mga paraan ng pakikibagay sa mga kapaligirang hindi naman po talaga ginawa para sa inyo. Madalas po itong nahuhubog nang tahimik sa loob ng maraming taon."},
      sB:{t:'Unmasked <em>Autism</em>',s:"Mga likas na katangian na nasa ilalim ng inyong pagkatao — kahit gaano pa kahusay kayong matuto na makibagay",n:"Ito po ay mga katangiang hindi nawawala kahit anong pagsisikap o pagsasanay. Ipinapakita nito kung paano nakaayos ang inyong nervous system at pang-unawa — hindi kung paano ninyo piniling ipakita ang sarili."},
      sC:{t:'Attention <em>& Executive Function</em>',s:'Kung paano pinamamahalaan ng inyong isip ang pokus, oras, at mga gawain'},
      sD:{t:'Magkasalungat na <em>Karanasan sa Loob</em>',s:'Mga pattern na para bang magkasalungat — pero parehong totoo nang sabay'},
      q:{
        1:"Bago ang isang usapan o sitwasyong panlipunan, ineensayo ko muna sa isip ang sasabihin ko — iniisip ang mga posibleng mangyari, sagot, o resulta nang maaga.",
        2:"Pagkatapos ng pakikisalamuha, nakakaramdam ako ng pagod sa isip o damdamin — kahit maayos naman ang nangyari.",
        3:"Minsan, napapansin kong nagagaya ko ang tono, galaw, o ekspresyon ng iba sa gitna ng usapan o pakikipag-ugnayan.",
        4:"Ang mga pagbabago sa plano, routine, o kapaligiran ay nagdudulot sa akin ng matinding stress sa loob — kahit mukha akong kalmado sa labas.",
        5:"Napapansin kong sobra kong pinag-iisipan ang mga pakikisalamuha pagkatapos — inuulit-ulit sa isip kung ano ang sinabi, ano ang ibig sabihin, kung tama ba ang sagot ko.",
        6:"Sa mga sitwasyong panlipunan, minsan parang may ginagampanan akong papel sa halip na maging totoong ako lang.",
        26:"May mga partikular na paksa o larangan na palagi kong binabalikan nang may malalim na interes — naiipon ko ang kaalaman tungkol dito at parang malaking bahagi ito ng pagkatao ko.",
        28:"Madalas kong napapansin ang maliliit na tunog, texture, amoy, o liwanag na parang hindi napapansin ng iba sa paligid ko.",
        29:"Kapag may sinabi ang isang tao pero parang iba ang ibig sabihin, kailangan kong pag-isipang mabuti kung ano talaga ang ibig nilang sabihin — hindi po ito basta-basta dumarating sa akin.",
        30:"Ang pag-alam kung ano ang nararamdaman ng isang tao base lang sa mukha nila ay hindi likas sa akin — madalas kailangan kong hulaan o magtanong.",
        31:"Nahihirapan akong malaman kung ano ang gusto ng tao sa isang interaksyon maliban kung sasabihin nila nang diretso.",
        32:"Naaakit ako sa pag-iipon o pag-aayos ng detalyadong impormasyon tungkol sa mga partikular na paksa o kategorya — nakakatuwa ito sa akin sa paraang hindi laging naiintindihan ng iba.",
        8:"Madalas gumagala ang isip ko — sa gitna ng usapan, gawain, o tahimik na sandali — kahit sinisikap kong manatiling nakatutok.",
        9:"Nakakapanibagong simulan ang mga gawain. Kahit alam ko kung ano ang dapat gawin, malayo ang agwat sa pagitan ng balak at aksyon.",
        10:"Mabilis o parang hindi mapakali ang mga iniisip ko — kahit pagod ako o nagpapahinga, patuloy na tumatakbo ang isip ko.",
        11:"Nakakalimutan ko ang mga detalye, appointment, o mga sinabi sa akin — hindi dahil wala akong pakialam, kundi dahil parang hindi tumatatak ang impormasyon.",
        12:"Madalas magulo o mahirap ayusin ang mga iniisip ko — mas mahirap ang pagpaplano at pag-aayos ng mga hakbang kaysa sa nararapat.",
        13:"Mabilis ang pagtaas-baba ng damdamin ko sa loob, pero hindi ko ito laging ipinapakita sa labas.",
        14:"Napapahinto ang atensyon ko sa gitna ng usapan o pulong, nawawalan ng mahahalagang impormasyon kahit sinisikap kong makinig.",
        15:"Sinisimulan ko ang mga gawain nang may magandang intensyon pero madalas napupunta ako sa ibang bagay bago matapos.",
        27:"Sobrang naeexcite ako sa mga bagong libangan o interes, sumusubsob ako nang buong-buo — tapos napupunta ako sa iba bago pa matagalan, isa o dalawa lang ang tumatagal.",
        17:"Hinahanap ko ang bago at kasiyahan — tulad ng biglaang pagsisimula ng mga proyekto — pero naiilang din ako nang husto sa mga pagbabago sa routine o plano ko.",
        18:"Kaya kong mag-hyperfocus nang husto sa mga paksang interesado ako nang ilang oras, pero nahihirapan akong manatiling nakatutok sa pang-araw-araw na gawain — kaya may mga pabugso-bugsong produktibidad at pagkahapo.",
        19:"Nararanasan ko ang sensory shutdown (nadadaig at kailangang umurong) at sensory seeking (naghahanap ng stimulation, galaw, o ingay) — minsan sa iisang araw.",
        20:"Kumikilos ako nang padalos-dalos sa sandali, tapos gumugugol ako ng oras pagkatapos sa sobrang pag-iisip kung ano ang sinabi o ginawa ko.",
        21:"Kailangan ko ng panlabas na estruktura para makapag-function, pero lumalaban o tumatakbo ang isip ko laban mismo sa mga routine na sinusubukan kong itakda para sa sarili.",
        22:"Nararamdaman ko ang damdamin nang malalim at matindi, pero may mga paraan akong natutunan para itago o pigilan ito — kaya madalas hindi alam ng iba ang buong bigat ng dinadala ko.",
        23:"Gusto ko ng koneksyon at pagiging kabilang, pero madalas namamali ako sa pagbasa ng social cues o pakiramdam kong hindi tugma sa grupo — kahit sa pamilyar na lugar.",
        24:"Umaasa ako sa mahigpit na personal na ritwal o routine para makaramdam ng kaligtasan, pero nahihirapan din akong tapusin ang mga structured na gawain kapag iba ang nagtakda."
      },
      btnContinue:'Magpatuloy para isumite',
      errorMsg:'Pakisagot po ang lahat ng tanong bago magpatuloy.',
      intakeTitle:'Malapit na — <em>huling hakbang</em>',
      intakeSub:'Handa nang ipadala ang inyong mga sagot. Ilagay ang inyong pangalan at email para makapag-follow up sa inyo ang practitioner nang personal.',
      labelName:'Inyong pangalan', labelEmail:'Email address',
      namePh:'Buong pangalan', emailPh:'ikaw@example.com',
      intakeBtn:'Ipadala ang aking mga sagot',
      intakeError:'Pakilagay po ang tamang pangalan at email address.',
      sending:'Ipinapadala ang inyong mga sagot…',
      privacy:"Ang inyong mga score ay direktang ipinapadala sa practitioner — hindi ninyo ito makikita rito. Susuriin ito ni Rinka at mag-follow up sa inyo nang personal.",
      confirmTitle:'Tapos na ang inyong<br><em>screening</em>',
      confirmP1:"Salamat po sa paglaan ng oras para mag-isip at sumagot. Ang inyong ibinahagi ay nagbibigay kay Rinka ng mas malinaw na larawan kung paano ninyo nararanasan ang mundo — at kung paano kayo pinakamabuting matutulungan.",
      confirmP2:"Susuriin niya ang inyong mga sagot bago ang inyong session. Wala na po kayong kailangang gawin para maghanda.",
      btnBook:'Mag-book ng Scoping Session'
    }
  };

  const OPT_META=[{val:3,cls:'sel-2'},{val:2,cls:'sel-1'},{val:0,cls:'sel-0'}];

  function buildButtons() {
    ALL_QS.forEach(q=>{
      const wrap=document.getElementById('q'+q);
      wrap.innerHTML='';
      OPT_META.forEach((opt,i)=>{
        const btn=document.createElement('button');
        btn.className='response-btn';
        btn.textContent=T[lang].keys[i];
        btn.dataset.val=opt.val; btn.dataset.cls=opt.cls;
        if(answers[q]===opt.val) btn.classList.add(opt.cls);
        btn.onclick=()=>selectOption(wrap,btn,q);
        wrap.appendChild(btn);
      });
    });
  }

  function selectOption(wrap,btn,q){
    wrap.querySelectorAll('.response-btn').forEach(b=>b.classList.remove('sel-2','sel-1','sel-0'));
    btn.classList.add(btn.dataset.cls);
    answers[q]=parseInt(btn.dataset.val);
    wrap.closest('.q-card').classList.add('answered');
    updateProgress();
  }

  function updateProgress(){
    const done=Object.keys(answers).length;
    const pct=Math.round((done/TOTAL)*100);
    document.getElementById('progress-fill').style.width=pct+'%';
    document.getElementById('progress-text').textContent=T[lang].progress(done);
    document.getElementById('progress-pct').textContent=pct+'%';
  }

  function applyLang(){
    const t=T[lang];
    document.documentElement.lang=lang;
    document.getElementById('title').innerHTML=t.title;
    document.getElementById('header-note').textContent=t.headerNote;
    document.getElementById('response-key').innerHTML=
      `<span class="key-chip" style="border-color:rgba(91,168,196,0.5);color:var(--teal-light);">${t.keys[0]}</span><span class="key-sep">·</span><span class="key-chip" style="border-color:rgba(196,128,64,0.5);color:#d9a06a;">${t.keys[1]}</span><span class="key-sep">·</span><span class="key-chip">${t.keys[2]}</span>`;
    document.getElementById('sA-title').innerHTML=t.sA.t; document.getElementById('sA-sub').textContent=t.sA.s; document.getElementById('sA-note').textContent=t.sA.n;
    document.getElementById('sB-title').innerHTML=t.sB.t; document.getElementById('sB-sub').textContent=t.sB.s; document.getElementById('sB-note').textContent=t.sB.n;
    document.getElementById('sC-title').innerHTML=t.sC.t; document.getElementById('sC-sub').textContent=t.sC.s;
    document.getElementById('sD-title').innerHTML=t.sD.t; document.getElementById('sD-sub').textContent=t.sD.s;
    ALL_QS.forEach(q=>{ document.getElementById('q'+q+'t').textContent=t.q[q]; });
    document.getElementById('btn-continue-text').textContent=t.btnContinue;
    document.getElementById('error-msg').textContent=t.errorMsg;
    document.getElementById('intake-title').innerHTML=t.intakeTitle;
    document.getElementById('intake-sub').textContent=t.intakeSub;
    document.getElementById('label-name').textContent=t.labelName;
    document.getElementById('label-email').textContent=t.labelEmail;
    document.getElementById('intake-name').placeholder=t.namePh;
    document.getElementById('intake-email').placeholder=t.emailPh;
    document.getElementById('intake-btn').textContent=t.intakeBtn;
    document.getElementById('intake-error').textContent=t.intakeError;
    document.getElementById('sending-msg').textContent=t.sending;
    document.getElementById('privacy-note').textContent=t.privacy;
    document.getElementById('confirm-title').innerHTML=t.confirmTitle;
    document.getElementById('confirm-p1').textContent=t.confirmP1;
    document.getElementById('confirm-p2').textContent=t.confirmP2;
    document.getElementById('btn-book-text').textContent=t.btnBook;
    buildButtons();
    updateProgress();
  }

  function setLang(l){
    lang=l;
    document.getElementById('btn-en').classList.toggle('active',l==='en');
    document.getElementById('btn-tl').classList.toggle('active',l==='tl');
    applyLang();
  }

  function get(q){ return answers[q]!==undefined?answers[q]:0; }
  function computeScores(){
    const masked=1.5*(get(1)+get(3)+get(5))+1.2*(get(2)+get(4)+get(6))+1.0*get(26);
    const unmasked=1.0*(get(28)+get(29)+get(30)+get(31)+get(32));
    const adhd=1.5*(get(8)+get(10)+get(12)+get(14))+1.2*(get(9)+get(11)+get(15))+1.0*(get(13)+get(27));
    const audhd=1.5*(get(17)+get(18)+get(21)+get(24))+1.2*(get(19)+get(20)+get(22))+1.0*get(23);
    return {masked,unmasked,adhd,audhd};
  }
  function getLabel(score,max){
    const pct=score/max;
    if(pct<=0.20) return 'Minimal pattern indicators';
    if(pct<=0.40) return 'Some pattern indicators present';
    if(pct<=0.60) return 'Moderate pattern indicators';
    if(pct<=0.80) return 'Strong pattern indicators';
    return 'Very strong pattern indicators';
  }

  function goToIntake(){
    const unanswered=ALL_QS.filter(q=>answers[q]===undefined);
    if(unanswered.length>0){
      document.getElementById('error-msg').style.display='block';
      const fm=document.querySelector('[data-q="'+unanswered[0]+'"]');
      if(fm) fm.scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
    document.getElementById('error-msg').style.display='none';
    document.getElementById('form-screen').style.display='none';
    document.getElementById('intake-screen').style.display='block';
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function handleSubmit(){
    const name=document.getElementById('intake-name').value.trim();
    const email=document.getElementById('intake-email').value.trim();
    const emailOk=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if(!name||!emailOk){ document.getElementById('intake-error').style.display='block'; return; }
    document.getElementById('intake-error').style.display='none';
    const s=computeScores();
    document.getElementById('intake-btn').disabled=true;
    document.getElementById('sending-msg').style.display='block';

    const iframeEl=document.createElement('iframe');
    iframeEl.name='_fs_target'; iframeEl.style.display='none'; document.body.appendChild(iframeEl);
    const formEl=document.createElement('form');
    formEl.method='POST'; formEl.action=FORMSPREE_URL; formEl.target='_fs_target'; formEl.style.display='none';

    const fields={
      name,email,_replyto:email,_to:'rinka.sycip@gmail.com',
      _subject:'Neurodivergence Screening — '+name,
      language_used: lang==='tl'?'Tagalog':'English',
      '01_masked_autism_score':s.masked.toFixed(1)+' / 27.3 — '+getLabel(s.masked,27.3),
      '02_unmasked_autism_score':s.unmasked.toFixed(1)+' / 15.0 — '+getLabel(s.unmasked,15.0),
      '03_adhd_score':s.adhd.toFixed(1)+' / 34.8 — '+getLabel(s.adhd,34.8),
      '04_audhd_paradox_score':s.audhd.toFixed(1)+' / 31.8 — '+getLabel(s.audhd,31.8),
    };
    ALL_QS.forEach(q=>{
      const v=answers[q];
      fields['q'+q]=v===3?'I can relate to this':v===2?'I relate to this somewhat':'I have never experienced this';
    });
    Object.entries(fields).forEach(([k,v])=>{
      const inp=document.createElement('input'); inp.type='hidden'; inp.name=k; inp.value=v; formEl.appendChild(inp);
    });
    document.body.appendChild(formEl); formEl.submit();
    setTimeout(()=>{
      document.getElementById('intake-screen').style.display='none';
      document.getElementById('confirm-screen').style.display='block';
      window.scrollTo({top:0,behavior:'smooth'});
    },800);
  }

  applyLang();
</script>
</body>
</html>
